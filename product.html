<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>De-Shahzaib — Shirt</title><meta name="description" content="De-Shahzaib premium men's formal shirt."><meta name="theme-color" content="#080e19">
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css">
<style>
.pp{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px clamp(28px,5vw,80px);padding-top:130px;padding-bottom:80px}
.crumbs{flex:0 0 100%;font-size:12px;color:var(--muted)}.crumbs a:hover{color:#fff}
.gal{flex:1 1 440px;min-width:0;max-width:100%}
.main{position:relative;width:100%;border:1px solid var(--line);background:#f2f1ed;overflow:hidden;cursor:zoom-in}
.main::before{content:"";display:block;padding-top:100%}
.main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .35s}.main.zoom{cursor:zoom-out}.main.zoom img{transform:scale(1.9)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:1px solid var(--line);background:rgba(8,14,25,.7);font-size:20px;z-index:2}.arrow.prev{left:12px}.arrow.next{right:12px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.thumbs button{width:72px;height:72px;border:1px solid var(--line);padding:0;opacity:.6}.thumbs button[aria-current=true]{opacity:1;border-color:var(--accent)}.thumbs button{background:#f2f1ed}.thumbs img{width:100%;height:100%;object-fit:contain}
.info{flex:1 1 340px;min-width:0}.info h1{font-size:clamp(34px,4vw,56px);margin:14px 0}.price{font-size:24px;margin-bottom:18px}.desc{color:var(--muted);max-width:52ch}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}.sizes button{min-width:58px;height:46px;border:1px solid var(--line)}.sizes button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.qty{display:flex;border:1px solid var(--line)}.qty button,.qty span{width:44px;height:50px;display:grid;place-items:center}
.add{flex:1;min-width:200px;background:var(--text);color:var(--bg)}.msg{min-height:24px;margin-top:14px;font-size:13px}.msg a{text-decoration:underline}
.more{flex:0 0 100%;min-width:0;padding-top:30px}.more h2{font-size:clamp(28px,3vw,44px);margin-bottom:24px}.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.mg a{display:block}.mg img{aspect-ratio:1;object-fit:contain;background:#f2f1ed;width:100%;border:1px solid var(--line);margin-bottom:8px}
@media(max-width:820px){.pp{padding-top:104px}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html" aria-label="De-Shahzaib home"><span class="mark"><img src="assets/logo.png" alt="" width="25" height="30"></span><span>DE-SHAHZAIB<small>CRAFTED FOR CONFIDENCE</small></span></a>
<nav class="desktop-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="index.html#craft">The details</a><a href="index.html#story">Our story</a></nav>
<div class="header-actions"><a class="bag-button" href="shop.html#bag">Bag <span id="bagCount">0</span></a></div></header>
<main class="pp section-shell" id="app"></main>
<footer class="section-shell" style="border-top:1px solid var(--line);padding:30px 0 40px;display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;font-size:13px;color:var(--muted)"><span>© 2026 De-Shahzaib · Made in Pakistan</span><nav><a href="index.html">Home</a> · <a href="shop.html">Shop</a> · <a href="index.html#care">Customer care</a> · <a href="terms.html">Terms &amp; conditions</a></nav></footer><script src="products.js"></script><script src="fit.js"></script>
<script>
(()=>{const K='de-shahzaib-ready-html-v1-cart',P=window.DE_SHAHZAIB_PRODUCTS||[],$=id=>document.getElementById(id),
E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'Rs '+Number(n).toLocaleString('en-PK');
const rd=()=>{try{return JSON.parse(localStorage.getItem(K))||[]}catch{return[]}},wr=c=>{try{localStorage.setItem(K,JSON.stringify(c));return true}catch{return false}};
const count=()=>{$('bagCount').textContent=rd().reduce((n,l)=>n+(l.quantity||0),0)};count();
const id=new URLSearchParams(location.search).get('id'),p=P.find(x=>x.id===id),app=$('app');
if(!p){app.innerHTML='<div class="crumbs"><a href="index.html">Home</a></div><div class="info"><h1>Shirt not found</h1><p class="desc">This shirt is no longer available.</p><p><a class="button" href="shop.html#collection" style="margin-top:20px">Back to the collection</a></p></div>';return}
const imgs=(p.images&&p.images.length?p.images:[p.image]);let cur=0,size=null,q=1;
document.title=p.name+' — De-Shahzaib';document.querySelector('meta[name=description]').content=p.description;
app.innerHTML=`<div class="crumbs"><a href="index.html">Home</a> / <a href="shop.html#collection">Collection</a> / ${E(p.name)}</div>
<div class="gal"><div class="main" id="main"><button class="arrow prev" id="prev" aria-label="Previous photo" ${imgs.length<2?'hidden':''}>‹</button><img id="big" alt="${E(p.name)}"><button class="arrow next" id="next" aria-label="Next photo" ${imgs.length<2?'hidden':''}>›</button></div>
<div class="thumbs" id="thumbs" ${imgs.length<2?'hidden':''}>${imgs.map((s,i)=>`<button data-i="${i}" aria-label="Photo ${i+1}"><img src="${E(s)}" alt=""></button>`).join('')}</div></div>
<div class="info"><p class="eyebrow">${E(p.category==='Dobby'?'Dobby & texture':p.category)} · ${E(p.colour)}</p><h1>${E(p.name)}</h1><p class="price">${money(p.price)}</p><p class="desc">${E(p.description)}</p>
<p class="eyebrow" style="margin-top:30px">Collar size · <a href="index.html#craft" style="text-decoration:underline">Size guide</a></p><div class="sizes" id="sizes">${p.sizes.map(s=>`<button data-s="${E(s)}" aria-pressed="false">${E(s)}"</button>`).join('')}</div>
<div class="row"><div class="qty"><button id="minus" aria-label="Less">−</button><span id="qv">1</span><button id="plus" aria-label="More">+</button></div><button class="button add" id="add">Add to bag</button></div><p class="msg" id="msg" role="status"></p></div>`;
const show=()=>{$('big').src=imgs[cur];dsFit($('big'),$('main'));document.querySelectorAll('#thumbs button').forEach((b,i)=>b.setAttribute('aria-current',i===cur))};show();
const go=d=>{cur=(cur+d+imgs.length)%imgs.length;show()};$('prev').onclick=e=>{e.stopPropagation();go(-1)};$('next').onclick=e=>{e.stopPropagation();go(1)};
$('main').onclick=e=>{const m=$('main'),r=m.getBoundingClientRect();$('big').style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%';m.classList.toggle('zoom')};$('thumbs').onclick=e=>{const b=e.target.closest('button');if(b){cur=+b.dataset.i;show()}};
$('sizes').onclick=e=>{const b=e.target.closest('button');if(!b)return;size=b.dataset.s;document.querySelectorAll('#sizes button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('minus').onclick=()=>{q=Math.max(1,q-1);$('qv').textContent=q};$('plus').onclick=()=>{q=Math.min(10,q+1);$('qv').textContent=q};
$('add').onclick=()=>{const m=$('msg');if(!size){m.textContent='Please select a collar size first.';return}
const c=rd(),l=c.find(x=>x.id===p.id&&x.size===size);if(l){if(l.quantity+q>10){m.textContent='Up to 10 of each size per order.';return}l.quantity+=q}else c.push({id:p.id,size,quantity:q});
if(!wr(c)){m.textContent='Could not save your bag. Please allow site storage.';return}count();m.innerHTML='Added to your bag. <a href="shop.html#bag">View bag</a>'};
const o=P.filter(x=>x.id!==p.id).slice(0,4);if(o.length){const s=document.createElement('section');s.className='more';
s.innerHTML='<h2>You may also like</h2><div class="mg">'+o.map(x=>`<a href="product.html?id=${encodeURIComponent(x.id)}"><img src="${E(x.image.replace('assets/','assets/thumbs/'))}" onerror="this.onerror=null;this.src='${E(x.image)}'" alt="" loading="lazy"><h3>${E(x.name)}</h3><p class="muted">${money(x.price)}</p></a>`).join('')+'</div>';app.appendChild(s);s.querySelectorAll('.mg img').forEach(i=>dsFit(i,i))}
})();
</script></body></html>
